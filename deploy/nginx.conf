server {
  listen 80;
  server_name dubla.uz www.dubla.uz;
  return 301 https://dubla.uz$request_uri;
}

server {
  listen 443 ssl http2;
  server_name dubla.uz;
  ssl_certificate /etc/letsencrypt/live/dubla.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dubla.uz/privkey.pem;

  root /opt/dubla/current/dist;
  index index.html;
  client_max_body_size 250m;

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
